name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ev-iletisimi-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: APK'yı apk dalına koy
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/ev-iletisimi.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/ev-iletisimi.apk .
          echo "$GITHUB_RUN_NUMBER" > version.txt
          git add ev-iletisimi.apk version.txt
          git commit -qm "APK ${GITHUB_SHA}"
          git push -f origin apk
