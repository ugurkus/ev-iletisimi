name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee /tmp/build.log
      - name: Hata kaydını ci-log dalına koy
        if: failure()
        run: |
          mkdir -p /tmp/log && cp /tmp/build.log /tmp/log/ || true
          cp -r app/build/test-results /tmp/log/ 2>/dev/null || true
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "CI kaydı ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-log
      - uses: actions/upload-artifact@v4
        with:
          name: ev-iletisimi-apk
          path: app/build/outputs/apk/release/*.apk
      - name: APK'yı apk dalına koy
        run: |
          cp app/build/outputs/apk/release/app-release.apk /tmp/ev-iletisimi.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/ev-iletisimi.apk .
          echo "$GITHUB_RUN_NUMBER" > version.txt
          git add ev-iletisimi.apk version.txt
          git commit -qm "APK ${GITHUB_SHA}"
          git push -f origin apk
